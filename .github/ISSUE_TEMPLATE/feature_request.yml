name: Feature request
description: Something Canopy should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Accounts and web mode, Folder sync, Snapshots, Local editor, Compiling, Zotero, Writing dashboard, Lite mode, Install and updates, Other]
