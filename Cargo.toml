[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]
# the GUI crate needs webkitgtk on Linux, so plain `cargo test` stays headless
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Londopy/canopy"
authors = ["Londopy"]
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
# the same reqwest and rustls-on-ring the updater plugin already pulls in, so
# no second TLS stack gets compiled
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "multipart", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
notify = "8"
notify-debouncer-full = "0.7"
diffy = "0.5"
regex = "1"
flate2 = "1"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

canopy-overleaf = { path = "crates/overleaf-client" }
canopy-sync = { path = "crates/sync" }
canopy-texkit = { path = "crates/texkit" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# no panic = "abort": the panic hook logs before the process goes down
