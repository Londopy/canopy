[package]
name = "canopy"
description = "A desktop harness for Overleaf: the real editor plus local sync, local compile and offline editing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
default-run = "Canopy"

[lib]
# the _lib suffix keeps the lib name apart from the bin on Windows (cargo#8519)
name = "canopy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Canopy"
path = "src/main.rs"

[features]
default = ["full"]
# local mode, sync and snapshots. `--no-default-features` builds Canopy Lite:
# the web-mode shell only, for a smaller download
full = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
canopy-overleaf.workspace = true
canopy-sync.workspace = true
canopy-texkit.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile.workspace = true
