[package]
name = "canopy"
description = "A desktop harness for Overleaf: the real editor plus local sync, local compile and offline editing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
default-run = "Canopy"

[lib]
# the _lib suffix keeps the lib name apart from the bin on Windows (cargo#8519).
# rlib only: the template's staticlib/cdylib are for mobile targets, and each
# one links every dependency in again, which costs gigabytes in target/
name = "canopy_lib"
crate-type = ["rlib"]

[[bin]]
name = "Canopy"
path = "src/main.rs"

[features]
default = ["full"]
# local mode, sync and snapshots. `--no-default-features` builds Canopy Lite:
# the web-mode shell only, for a smaller download (no git, no watcher)
full = [
    "dep:canopy-sync",
    "dep:notify-debouncer-full",
    "dep:tokio",
    "dep:reqwest",
    "dep:rustls",
    "dep:sha2",
    "dep:flate2",
    "dep:regex",
    "dep:ignore",
    "dep:portable-pty",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
canopy-overleaf.workspace = true
canopy-sync = { workspace = true, optional = true }
canopy-texkit.workspace = true
notify-debouncer-full = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# full build: texlab download, Zotero, project search, the terminal
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# unstable: child webviews, which web mode lays over the shell. 2.11.1 is the
# first release that refuses commands from remote origins, which web mode leans on
tauri = { version = "2.11.1", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile.workspace = true
